# Backend service. Set this service's root directory to the repository root
# and name the service `hike-api` so the frontend can reference it.
# The start command is the Dockerfile CMD: langgraph dev on 0.0.0.0:$PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
